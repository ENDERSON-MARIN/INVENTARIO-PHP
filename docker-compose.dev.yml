version: "3.8"

# Docker Compose para DESENVOLVIMENTO
# Uso: docker compose -f docker-compose.dev.yml up

services:
  # Aplicação Laravel (modo desenvolvimento)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario-app-dev
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-inventario_dev}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    depends_on:
      - mysql
      - redis
    networks:
      - inventario-dev-network
    ports:
      - "8000:80"

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: inventario-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventario_dev}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-dev-data:/var/lib/mysql
    networks:
      - inventario-dev-network
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: inventario-redis-dev
    restart: unless-stopped
    networks:
      - inventario-dev-network
    ports:
      - "6380:6379"

  # PHPMyAdmin (opcional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: inventario-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - mysql
    networks:
      - inventario-dev-network
    ports:
      - "8081:80"

networks:
  inventario-dev-network:
    driver: bridge

volumes:
  mysql-dev-data:
    driver: local
